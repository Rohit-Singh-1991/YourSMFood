name: Build Android APK and Play Store AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create temporary upload keystore
        shell: bash
        run: |
          set -e
          KEY_PASSWORD="ysmf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-upload"
          keytool -genkeypair -v \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -alias yoursmfood-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=YourSMFood, OU=Android, O=YourSMFood, L=Delhi, ST=Delhi, C=IN"
          printf '%s\n' \
            'storePassword='$KEY_PASSWORD \
            'keyPassword='$KEY_PASSWORD \
            'keyAlias=yoursmfood-upload' \
            'storeFile=upload-keystore.jks' > android/key.properties
          {
            echo '## Play Store upload key details'
            echo
            echo 'Alias: yoursmfood-upload'
            echo "Password: $KEY_PASSWORD"
            echo 'Keep this password and keystore safe. Future Play Store updates should use the same upload key, or the upload key can be reset in Play Console if necessary.'
          } > playstore-upload-key.txt

      - name: Build signed release APK
        run: flutter build apk --release --build-name=1.0.2 --build-number=3

      - name: Build signed release AAB
        run: flutter build appbundle --release --build-name=1.0.2 --build-number=3

      - name: Upload Play Store bundle and APK
        uses: actions/upload-artifact@v4
        with:
          name: yoursmfood-playstore-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            android/upload-keystore.jks
            playstore-upload-key.txt
          if-no-files-found: error
          retention-days: 90
