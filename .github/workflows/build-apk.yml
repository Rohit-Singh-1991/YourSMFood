name: Build Android APK and Play Store AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Configure release signing
        shell: bash
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.YOURSMFOOD_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YOURSMFOOD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YOURSMFOOD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YOURSMFOOD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_B64" || { echo "Missing YOURSMFOOD_UPLOAD_KEYSTORE_B64"; exit 1; }
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties

      - name: Validate Android target API
        run: |
          grep -n 'targetSdk' android/app/build.gradle.kts
          grep -n 'applicationId\|versionCode\|versionName' android/app/build.gradle.kts

      - name: Build signed release APK
        run: flutter build apk --release --build-name=1.0.2 --build-number=3

      - name: Build signed release AAB
        run: flutter build appbundle --release --build-name=1.0.2 --build-number=3

      - name: Upload Play Store bundle and APK
        uses: actions/upload-artifact@v4
        with:
          name: yoursmfood-playstore-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
